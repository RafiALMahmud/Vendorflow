name: Checks
on:
  pull_request:
  push:
    branches: [main, feat/dev2-risk-review, 'feat/complete-vendorflow-mvp*']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vendorflow
          POSTGRES_PASSWORD: vendorflow
          POSTGRES_DB: vendorflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vendorflow -d vendorflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://vendorflow:vendorflow@localhost:5432/vendorflow_test
      TEST_DATABASE_URL: postgresql+psycopg://vendorflow:vendorflow@localhost:5432/vendorflow_test
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pip check
      - name: Check migrations and review rollback
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0005_add_extraction_state
          python -m alembic upgrade head
      - run: python -m pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  release-browser-ocr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vendorflow
          POSTGRES_PASSWORD: vendorflow
          POSTGRES_DB: vendorflow_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vendorflow -d vendorflow_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://vendorflow:vendorflow@localhost:5432/vendorflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -e './backend[dev]'
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m scripts.evaluate_release_fixtures --output ../.local/ocr-results.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-ocr-evidence
          path: |
            .local/ocr-results.json
            .local/browser-results.json
            frontend/test-results/
