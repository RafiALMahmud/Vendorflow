[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendorflow-backend"
version = "0.1.0"
description = "VendorFlow AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

